name: addon-ami

# AMI に関わる変更のときだけ動く。tools/ は AMI も使うので含める。
# 検査の中身は addons/ami/check.sh（手元でも同じものを回せる）。道具の版は addons/ami/ci.env。
# シートの描画（Blender）は CI ではしない（#50）。
on:
  push:
    branches: [main]
    paths:
      - "addons/ami/**"
      - "tools/**"
      - ".github/workflows/addon-ami.yml"
  pull_request:
    paths:
      - "addons/ami/**"
      - "tools/**"
      - ".github/workflows/addon-ami.yml"

permissions:
  contents: read

jobs:
  ami:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TOOLS_DIR: ${{ github.workspace }}/../ci-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: 道具の版を読む
        run: grep -E '^[A-Z_]+=' addons/ami/ci.env >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: ci-tools-${{ runner.os }}-makeobj-${{ env.MAKEOBJ }}-datlinter-${{ env.DAT_LINTER }}-headless-${{ env.HEADLESS_SIM }}

      - name: 検査
        run: bash addons/ami/check.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ami-pak
          path: addons/ami/dist/*.pak
          retention-days: 14

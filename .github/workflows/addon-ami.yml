name: addon-ami

# AMI に関わる変更のときだけ動く。tools/ は AMI も使うので含める。
# 道具の版は addons/ami/ci.env。シートの描画（Blender）は CI ではしない（#50）。
on:
  push:
    branches: [main]
    paths:
      - "addons/ami/**"
      - "tools/**"
      - ".github/workflows/addon-ami.yml"
  pull_request:
    paths:
      - "addons/ami/**"
      - "tools/**"
      - ".github/workflows/addon-ami.yml"

permissions:
  contents: read

jobs:
  ami:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TOOLS_DIR: ${{ github.workspace }}/../ci-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: 道具の版を読む
        run: grep -E '^[A-Z_]+=' addons/ami/ci.env >> "$GITHUB_ENV"

      - name: ruff
        run: pipx run "ruff==${RUFF}" check addons/ami tools

      - name: dat の書き忘れ
        run: |
          python -X utf8 addons/ami/blender/ami_dat.py > /dev/null
          if [ -n "$(git status --porcelain -- addons/ami/src)" ]; then
            git status --short -- addons/ami/src
            git diff -- addons/ami/src | head -100
            echo "::error::addons/ami/blender/ami_dat.py の出力と、コミットした src/ の dat が違う。手元で ami_dat.py を実行してコミットする"
            exit 1
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: ci-tools-${{ runner.os }}-makeobj-${{ env.MAKEOBJ }}-datlinter-${{ env.DAT_LINTER }}

      - name: 道具を用意する
        run: |
          bash tools/ci/setup-makeobj.sh "$MAKEOBJ" "$TOOLS_DIR/makeobj"
          bash tools/ci/setup-dat-linter.sh "$DAT_LINTER" "$TOOLS_DIR/dat_linter"
          echo "$TOOLS_DIR/makeobj" >> "$GITHUB_PATH"
          echo "$TOOLS_DIR/dat_linter" >> "$GITHUB_PATH"

      - name: dat_linter
        working-directory: addons/ami/src
        run: dat_linter lint --tile-size 256 .

      - name: pak を作る
        working-directory: addons/ami
        run: |
          { makeobj || true; } | head -1
          python -X utf8 build.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ami-pak
          path: addons/ami/dist/*.pak
          retention-days: 14
